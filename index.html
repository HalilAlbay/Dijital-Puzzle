<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101a2a"><title>Dijital Puzzle — Devre Ustası</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1424;color:#edf6ff;font:15px system-ui,-apple-system,sans-serif}.app{max-width:750px;margin:auto;padding:12px}header{display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font-size:23px;margin:8px 0}.badge{background:#213b55;padding:8px 12px;border-radius:20px}.intro{color:#b9d0e6;margin:6px 0 12px;line-height:1.4}.panel{background:linear-gradient(145deg,#152c45,#101c31);border:1px solid #365572;border-radius:17px;padding:7px;box-shadow:0 14px 30px #0005}svg{width:100%;height:auto;display:block;touch-action:none;user-select:none}.device{fill:#1e344d;stroke:#688ba8;stroke-width:2}.deviceLabel{fill:#eaf4ff;font-size:15px;font-weight:700;text-anchor:middle;pointer-events:none}.terminal{fill:#ffcd6e;stroke:#fff0bf;stroke-width:2;cursor:crosshair}.terminal.selected{fill:#7dfce0;stroke:#fff;stroke-width:3}.terminalText{fill:#c6ddf1;font-size:11px;text-anchor:middle;pointer-events:none}.wire{stroke:#a8bed3;stroke-width:5;fill:none;stroke-linecap:round}.wire.live{stroke:#54f4c0;filter:drop-shadow(0 0 5px #50ffbd)}.wire.draft{stroke:#ffdf7c;stroke-dasharray:9 6}.bulbGlow{fill:#ffe477;filter:drop-shadow(0 0 12px #ffe15b)}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}button{border:1px solid #5c83a3;background:#254563;color:white;border-radius:11px;padding:12px;font-size:14px;font-weight:700;flex:1;min-width:90px}button:disabled{opacity:.4}button.primary{background:#247f72}#message{min-height:48px;color:#d7eaff;font-weight:600;line-height:1.5}#hint{font-size:13px;color:#9eb8d1}.danger{color:#ff9b9b!important}.success{color:#8ef7c9!important}</style></head><body><main class="app"><header><h1>⚡ Devre Ustası</h1><span class="badge" id="counter">1 / 20</span></header><p class="intro">Sarı uçtan diğer sarı uca kablo çek. Yanlış bağlantı serbest! Devreyi kur, anahtarı aç ve elektriği test et.</p><div class="panel"><svg id="stage" viewBox="0 0 600 540" aria-label="Serbest bağlantılı elektrik devresi bulmacası"></svg></div><div id="message" role="status"></div><div class="actions"><button id="prev">◀ Önceki</button><button id="undo">↶ Son kablo</button><button id="clear">Kabloları sil</button><button class="primary" id="test">⚡ Elektriği aç</button><button id="next">Sonraki ▶</button></div><p id="hint">Kablo: bir sarı uçtan diğerine sürükle veya uçlara sırayla dokun. Kabloyu silmek için “Son kablo”.</p></main><script>
"use strict";
const NS="http://www.w3.org/2000/svg",svg=document.getElementById("stage"),msg=document.getElementById("message");
const TOTAL=20,KEY="devre-ustasi-v2",saved=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return {}}})();
let unlocked=Math.max(1,Math.min(TOTAL,Number(saved.unlocked)||1)),level=Math.max(1,Math.min(unlocked,Number(saved.level)||1)),wires=[],terminals=[],devices=[],selected=null,draft=null,energized=false,won=false,blown=false;
const el=(tag,attrs={},parent=svg)=>{const n=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);parent.append(n);return n};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({unlocked,level}))}catch{}};
const rand=(seed)=>{let x=seed|0;return()=>{x=(Math.imul(x,1664525)+1013904223)|0;return(x>>>0)/4294967296}};
function setup(l){
 level=l;wires=[];terminals=[];devices=[];selected=null;draft=null;energized=false;won=false;blown=false;
 const rng=rand(l*3571), bulbs=l<=5?1:l<=10?2:l<=15?3:l<=18?4:5, switches=l<=4?1:l<=12?2:3;
 const specs=[{kind:"battery",name:"PİL"},{kind:"switch",name:"ANAHTAR"}];
 for(let i=1;i<switches;i++)specs.push({kind:"switch",name:"ANAHTAR "+(i+1)});
 for(let i=0;i<bulbs;i++)specs.push({kind:"bulb",name:"AMPUL "+(i+1)});
 if(l>=3)specs.push({kind:"junction",name:"DAĞITICI"});if(l>=7)specs.push({kind:"junction",name:"DAĞITICI 2"});
 if(l>=2)specs.push({kind:"decoy",name:"BOŞ UÇ"});
 // Dispersed positions without a grid, with spacing for touch.
 const pts=[];for(const s of specs){let p,tries=0;do{p={x:80+rng()*440,y:65+rng()*405};tries++}while(tries<350&&pts.some(q=>Math.hypot(p.x-q.x,p.y-q.y)<110));pts.push(p)}
 specs.forEach((s,i)=>{const p=pts[i],id="d"+i;const dev={...s,id,x:p.x,y:p.y,on:true,ports:[]};devices.push(dev);const count=s.kind==="junction"?3:s.kind==="decoy"?1:2;
 for(let j=0;j<count;j++){const a=count===3?(-Math.PI/2+j*2*Math.PI/3):count===1?0:(j===0?Math.PI:0);const t={id:id+"p"+j,dev:id,idx:j,x:p.x+Math.cos(a)*51,y:p.y+Math.sin(a)*28};terminals.push(t);dev.ports.push(t.id)}
 });save();render();notice("Kabloları kendin bağla. Yanlış bağlantı yapabilirsin.");
}
function notice(s,cls=""){msg.textContent=s;msg.className=cls}
function connect(a,b){if(!a||!b||a===b)return;if(wires.some(w=>(w[0]===a&&w[1]===b)||(w[0]===b&&w[1]===a))){notice("Bu iki uç zaten bağlı.");return}
 const limit=level<=5?Infinity:level<=10?10:level<=15?12:level<=18?14:16;
 if(wires.length>=limit){notice("Kablo sınırına ulaştın. Bir kabloyu geri al.","danger");return}
 wires.push([a,b]);energized=false;blown=false;won=false;notice("Kablo bağlandı. Elektriği açarak devreyi kontrol et.");render()}
function evaluate(){
 const adj=new Map(terminals.map(t=>[t.id,[]]));const edge=(a,b)=>{adj.get(a).push(b);adj.get(b).push(a)};
 wires.forEach(w=>edge(...w));for(const d of devices){if(d.kind==="switch"&&d.on||d.kind==="junction"){for(let i=1;i<d.ports.length;i++)edge(d.ports[0],d.ports[i])}}
 const battery=devices.find(d=>d.kind==="battery"),start=battery.ports[0],end=battery.ports[1];
 const flood=(src,graph)=>{const seen=new Set([src]),q=[src];for(let i=0;i<q.length;i++)for(const v of graph.get(q[i]))if(!seen.has(v)){seen.add(v);q.push(v)}return seen};
 const direct=flood(start,adj);if(direct.has(end))return{short:true,lit:[]};
 // Full network: lamps conduct, but direct shorts are detected without crossing lamps.
 for(const d of devices.filter(d=>d.kind==="bulb"))edge(d.ports[0],d.ports[1]);
 const powered=flood(start,adj);const lit=devices.filter(d=>d.kind==="bulb"&&powered.has(d.ports[0])&&powered.has(d.ports[1])&&powered.has(end)).map(d=>d.id);
 return{short:false,lit,all:lit.length===devices.filter(d=>d.kind==="bulb").length&&lit.length>0};
}
function test(){const r=evaluate();energized=true;blown=r.short;won=!!r.all;if(blown)notice("⚠️ KISA DEVRE! Sigorta attı. Yanlış kabloyu çıkar ve yeniden dene.","danger");
 else if(won){unlocked=Math.max(unlocked,Math.min(TOTAL,level+1));save();notice("💡 Harika! Bütün ampuller yandı. Sonraki bölüm açıldı.","success")}
 else notice("Devre tamamlanmadı. Bağlantıları ve anahtarları kontrol et.");
 render()}
function render(){
 svg.replaceChildren();el("rect",{width:600,height:540,rx:14,fill:"#102238"});for(let i=0;i<25;i++){const x=30+i*23;el("line",{x1:x,y1:0,x2:x,y2:540,stroke:"#1a334b","stroke-width":.6})}
 const lit=energized&&!blown?evaluate().lit:[];const get=id=>terminals.find(t=>t.id===id);
 for(const [a,b] of wires){const A=get(a),B=get(b);el("path",{d:"M"+A.x+" "+A.y+" Q"+((A.x+B.x)/2+18)+" "+((A.y+B.y)/2-18)+" "+B.x+" "+B.y,class:"wire"+(energized&&!blown?" live":"")})}
 for(const d of devices){const litUp=lit.includes(d.id),g=el("g");el("rect",{x:d.x-43,y:d.y-25,width:86,height:50,rx:13,class:"device"},g);if(litUp)el("circle",{cx:d.x,cy:d.y,r:19,class:"bulbGlow"},g);
 const icon=d.kind==="battery"?"🔋":d.kind==="bulb"?(litUp?"💡":"◉"):d.kind==="switch"?(d.on?"⏻":"○"):d.kind==="junction"?"●":"?";
 const txt=el("text",{x:d.x,y:d.y+6,class:"deviceLabel"},g);txt.textContent=icon;
 const name=el("text",{x:d.x,y:d.y-37,class:"terminalText"},g);name.textContent=d.name;
 if(d.kind==="switch"){const hit=el("rect",{x:d.x-43,y:d.y-25,width:86,height:50,fill:"transparent",style:"cursor:pointer"},g);hit.addEventListener("pointerdown",e=>e.stopPropagation());hit.addEventListener("click",()=>{d.on=!d.on;energized=false;won=false;notice(d.on?"Anahtar açıldı.":"Anahtar kapandı.");render()})}
 }
 for(const t of terminals){el("circle",{cx:t.x,cy:t.y,r:16,fill:"transparent",class:"hit", "data-id":t.id});el("circle",{cx:t.x,cy:t.y,r:9,class:"terminal"+(selected===t.id?" selected":"") ,"data-id":t.id});}
 if(draft){const a=get(draft.a);el("path",{d:"M"+a.x+" "+a.y+" L"+draft.x+" "+draft.y,class:"wire draft"})}
 document.getElementById("counter").textContent=level+" / "+TOTAL;document.getElementById("prev").disabled=level===1;document.getElementById("next").disabled=level>=unlocked||level===TOTAL;
}
const point=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())};
const closest=p=>{let best=null,dist=22;for(const t of terminals){const d=Math.hypot(p.x-t.x,p.y-t.y);if(d<dist){dist=d;best=t.id}}return best};
let startPoint=null;
svg.addEventListener("pointerdown",e=>{const p=point(e),id=closest(p);if(!id)return;startPoint={id,x:p.x,y:p.y};draft={a:id,x:p.x,y:p.y};svg.setPointerCapture(e.pointerId);render()});
svg.addEventListener("pointermove",e=>{if(!draft)return;const p=point(e);draft.x=p.x;draft.y=p.y;render()});
svg.addEventListener("pointerup",e=>{if(!startPoint)return;const p=point(e),target=closest(p),from=startPoint.id,moved=Math.hypot(p.x-startPoint.x,p.y-startPoint.y)>20;draft=null;startPoint=null;
 if(target&&target!==from){connect(from,target);selected=null}else if(!moved){if(selected&&selected!==from){connect(selected,from);selected=null}else{selected=selected===from?null:from;notice(selected?"Şimdi ikinci bağlantı ucuna dokun.":"Seçim kaldırıldı.")}}render()});
svg.addEventListener("pointercancel",()=>{draft=null;startPoint=null;render()});
document.getElementById("test").onclick=test;document.getElementById("undo").onclick=()=>{wires.pop();energized=false;won=false;blown=false;notice("Son kablo kaldırıldı.");render()};
document.getElementById("clear").onclick=()=>{wires=[];energized=false;won=false;blown=false;notice("Bütün kablolar silindi.");render()};
document.getElementById("prev").onclick=()=>{if(level>1)setup(level-1)};
document.getElementById("next").onclick=()=>{if(level<unlocked&&level<TOTAL)setup(level+1)};
setup(level);
</script></body></html>
